# https://docs.continue.dev/reference

name: Default Config
version: 1.0.0
schema: v1
models:

  # This is the default profile, used on any machine that does not have a local
  # GPU to run large models. Chat is therefore served by a large general-purpose
  # model hosted in Ollama Cloud. The `-cloud` tag routes the request through the
  # local Ollama proxy out to Ollama's cloud, so the provider and base URL stay
  # the same as for local models.

  - name: Gemma 4 31b (Cloud)
    provider: ollama
    model: gemma4:31b-cloud
    roles:
      - chat

  # Editing and applying changes also run against a cloud model. Latency here is
  # network-bound rather than compute-bound, so there is little benefit to the
  # smaller, faster model used on the workstation – for the same round-trip cost
  # a more capable coder model produces more reliable diffs.

  - name: Qwen 3.5 (Cloud)
    provider: ollama
    model: qwen3.5:cloud
    roles:
      - edit
      - applying

  # Qwen2.5-Coder 1.5B proved to be too slow on my Dell XPS for a useful
  # autocomplete tool. Running local models should decrease latency for
  # autocomplete, which is a latency-critical path (the autocomplete event
  # fires on every keystroke - with a short debounce). However, I found
  # latency to be very high on CPU only, and switching to a cloud model
  # actually decreased the latency and reliability very considerably.

  # - name: Qwen2.5-Coder 1.5B
  #   provider: ollama
  #   model: qwen2.5-coder:1.5b-base
  #   roles:
  #     - autocomplete

  - name: Qwen3-Coder-Next
    provider: ollama
    model: qwen3-coder-next:cloud
    roles:
      - autocomplete

  # I'm still running an embeddings model locally on my laptop. This model
  # is used for codebase indexing, and apparently its small enough to run
  # comfortably on consumer CPU.

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed

  # Expose every other model that is pulled locally or available via Ollama
  # Cloud sign-in, so they can be selected manually in the UI without being
  # explicitly declared here. The `roles` list is scoped to `chat` on purpose:
  # an entry with no `roles` defaults to [chat, edit, apply, summarize], which
  # would let every autodetected model claim the silently selected edit/apply
  # roles and undercut the deliberate per-role models above.

  - name: Autodetect
    provider: ollama
    model: AUTODETECT
    roles:
      - chat
