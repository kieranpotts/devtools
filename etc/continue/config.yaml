# https://docs.continue.dev/reference

name: Local Config
version: 1.0.0
schema: v1
models:

  # Chat benefits from a large, general-purpose model. ~30B parameter count
  # gives the reasoning depth and knowledge breadth needed for open-ended
  # conversation where quality matters more than latency.

  - name: Gemma 4 31b
    provider: ollama
    model: gemma4:31b
    roles:
      - chat

  # For interactive editing and applying changes to existing code from
  # instructions, a mid-sized model that balances quality against speed
  # tends to be a good fit. The model should be capable enough to produce
  # correct diffs, but fast enough to keep the edit-feedback loop tight.
  # ~8B is the sweet spot for this workflow.

  - name: Llama 3.1 8B
    provider: ollama
    model: llama3.1:8b
    roles:
      - edit
      - apply

  # For autocomplete, in which responses are streamed inline as you type,
  # you want a small model trained primarily on code. Inline completions
  # fire on every keystroke, so latency is the primary constraint. Models
  # with ~1.5B parameters return suggestions fast enough to feel instant.
  #
  # The Qwen Coder models are tuned specificallyfor programming tasks,
  # so they still produce good quality outputs despite their compact size.
  # The `-base` variants are optimal for raw text continuation, rather
  # than chat-style instructions.

  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete

  # A dedicated embedding model is recommended for embedding tasks, ie.
  # tasks that require vector embeddings but not text generation
  # capabilities, eg. codebase indexing and semantic search.
  #
  # Nomic Embed is purpose-built for this, producing high-quality embeddings
  # cheaply across many files.

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed

  # The autodetect setting exposes every other model pulled into the local
  # Ollama install, so they can be selected manually in the UI without
  # being explicitly declared here.

  - name: Autodetect
    provider: ollama
    model: AUTODETECT
