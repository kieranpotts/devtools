; systemd drop-in for ollama.service.
;
; Install manually (requires root):
;
;   sudo mkdir -p /etc/systemd/system/ollama.service.d
;   sudo cp etc/ollama/override.conf /etc/systemd/system/ollama.service.d/override.conf
;   sudo systemctl daemon-reload
;   sudo systemctl restart ollama
;
; The rationale for each setting is documented in `./README.md`.

[Service]

; Server-wide context ceiling. Must be >= the harness's declared
; contextWindow, else history will be silently discarded.
Environment="OLLAMA_CONTEXT_LENGTH=32768"

; Disable parallel model execution. The objective here is to avoid out-of-memory
; conditions in an environment where VRAM is precious. See the calculations and
; rationale in `./README.md`.
Environment="OLLAMA_NUM_PARALLEL=1"

; One 32 GiB card can hold one 30B-class model.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

; Halves the KV cache at near-lossless quality. Falls back to f16 silently
; where flash attention is unsupported — so context length should still be
; sized against f16.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

; OLLAMA_FLASH_ATTENTION is deliberately unset. Since Ollama 0.31.2 an unset
; value means "auto-enable where the runtime and device support it". Forcing 1
; has caused quality regressions on ROCm.

; ROCR_VISIBLE_DEVICES is deliberately unset. Ollama already enumerates only
; the discrete card (ROCm0, 0000:03:00.0) and ignores the integrated GPU.
