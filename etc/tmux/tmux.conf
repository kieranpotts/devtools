#
# tmux config.
#
# https://github.com/tmux/tmux/wiki
#

# By default, tmux uses `C-b` (Ctrl-b) as the prefix key. However, many users
# find this key combination awkward (it collides with vim page-up and readline
# "back one character", and is a pinky stretch). Choosing a replacement is a
# trade-off against whatever else binds the key:
#
#   - `C-a`     Classic alternative; also what GNU screen uses. But readline
#               (bash/zsh default) binds it to "beginning of line", which you
#               use constantly. `send-prefix` lets you get it back via `C-a a`.
#   - `C-Space` Ergonomic and low-conflict, but Emacs uses it for set-mark and
#               some input-method (IME) switchers grab it.
#   - `C-t`     Ergonomic, comfortable reach. readline binds it to
#               "transpose-chars" (rarely used), but the real gotcha is that
#               many GUI terminal emulators bind `C-t` to "new tab" and will
#               swallow it before tmux sees it — check / remap that first.
#
# The `bind-key ... send-prefix` line lets the original key still be sent to the
# underlying program by pressing the prefix twice (e.g. `C-t t`). The following
# configuration remaps the prefix key from `C-b` to `C-t`.

unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# The default pane-splitting commands (`"` for vertical and `%` for horizontal)
# can be hard to remember. The following configuration swaps those for more
# intuitive characters, `|` and `-` respectively, whose shapes match the
# resulting divider:
#
#   - `|` runs `split-window -h`: a "horizontal" split in tmux's flag naming,
#     placing the new pane to the right with a vertical divider (left/right).
#   - `-` runs `split-window -v`: a "vertical" split, placing the new pane
#     below with a horizontal divider (top/bottom).
#
# The `-c "#{pane_current_path}"` option makes new panes open in the current
# pane's working directory; without it they would open in the directory tmux
# was originally started in. The `unbind` lines remove the defaults (`"` must
# be quoted as `'"'` because it is otherwise special to tmux).

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Use Alt+arrow keys, without the prefix key combination, to switch between
# panes. This is the key combination used in Terminator, a popular Linux
# terminal emulator with built-in multiplexing. You can't therefore use this key
# configuration with Terminator or any other terminal that uses the same keys.
# Note also that `Alt+Left`/`Alt+Right` are bound to word-wise movement in
# readline (bash/zsh) in some terminals; in those, shell line editing loses
# that shortcut while inside tmux.

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse support. This makes it easier
# to copy text from the tmux UI.

set -g mouse on

# Set a 256-color terminal type for sessions, and tell tmux that the outer
# terminal supports 24-bit "true color" (the RGB capability). Without these,
# colors in programs like Vim can appear washed out or wrong inside tmux. If
# your outer terminal does not support true color, the override is harmless.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start window numbering at 1. `pane-base-index` does the same for panes, so
# that pane and window numbering are consistent (both would otherwise start
# at 0).

set -g base-index 1
setw -g pane-base-index 1

# Increase the scrollback buffer from the default of 2000 lines so that more
# terminal history is retained per pane.

set -g history-limit 10000

# Enable some Vim keybindings. This enables, for example, the use of H, J, K and
# L to move the cursor left, down, up and right while in copy mode.

setw -g mode-keys vi

# Reduce the delay tmux waits after an escape key press from the default of
# 500ms. That delay is noticeable when pressing `Esc` frequently, which the Vim
# keybindings above make common. A small non-zero value is used (rather than 0)
# so that genuine escape sequences from the terminal are still recognized.

set -sg escape-time 10

# When you have multiple tmux windows open, the following settings will show a
# visual notification in the status line when activity is detected in another
# window, and highlights the window with the activity.

setw -g monitor-activity on
set -g visual-activity on

# Easily reload the configuration file with `C-t r`. The `display-message`
# gives visible confirmation that the reload happened.

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Type `C-t L` (ie Shift-l) to load the `layout` script that automates the
# creation of my typical pane layout.

bind L source-file ~/.tmux/layout

# tmux has no built-in way to persist sessions across a reboot — the tmux
# server and everything inside it dies when the machine restarts. The
# tmux-resurrect plugin saves session/window/pane layout (and working
# directories) to disk, and tmux-continuum automates saving (every 15 min)
# and restores automatically when tmux starts, so sessions survive a reboot
# without manual save/restore commands. Note this restores *structure*, not
# live process state — a running command is not resumed, just the shell and
# its working directory.
#
# Install/update plugins with `C-t I` (capital i), then reload this config
# (`C-t r`). Requires TPM (Tmux Plugin Manager).

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# This line must be at the very bottom of the config file.
run '~/.tmux/plugins/tpm/tpm'
